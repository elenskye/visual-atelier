<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>前十个模块</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/pomelo/tokens.css">
<link rel="stylesheet" href="ds/pomelo/components/bundle.css">
<script src="ds/pomelo/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>

body{margin:0}
.root{position:relative;width:1200px;height:620px;overflow:hidden;background:var(--color-desk);color:var(--color-ink)}
.tex{position:absolute;inset:0;background:var(--color-desk)}
.head{position:absolute;left:56px;top:40px;right:56px}
.title{margin:0;font-size:28px;line-height:36px;font-weight:700}
.sub{margin:6px 0 0;font-size:14px;line-height:22px;color:var(--color-ink-soft)}
.row{position:absolute;left:56px;right:56px}
.rowhead{display:flex;align-items:center;gap:14px;height:30px}
.label{position:relative;width:72px;height:28px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#20241F}
.label .tl{position:relative;z-index:5;line-height:28px}
.meta{display:flex;align-items:center;gap:7px;font-size:13px;line-height:20px;color:var(--color-ink-soft)}
.dot{display:block;width:9px;height:9px;border-radius:50%}
.cells{display:flex;gap:22px;margin-top:14px}
.cell{width:200px;display:flex;flex-direction:column;align-items:center}
.pic{width:96px;height:96px;display:grid;place-items:center}
.pic svg{display:block;overflow:visible}
.nm{margin-top:14px;font-size:15px;line-height:22px;font-weight:700;text-align:center}
.nid{margin-top:2px;font-size:11px;line-height:16px;letter-spacing:.04em;color:var(--color-ink-soft)}
.foot{position:absolute;left:56px;right:56px;bottom:26px;margin:0;font-size:12px;line-height:18px;color:var(--color-ink-soft)}

</style>
</helmet>
<div class="pm root" data-palette="{{palette}}" data-theme="{{theme}}">
<div class="tex" data-hand="desk" data-seed="1201"></div>

<header class="head">
  <h1 class="title">前十个模块</h1>
  <p class="sub">贴纸簿默认顺序的前十个 · 墨线、错开一点的填色、一圈白边、轻投影，都是手画的</p>
</header>

<section class="row" style="top:130px" aria-label="日常">
  <div class="rowhead">
    <span class="label" data-tape="0">日常</span>
    <span class="meta"><span class="dot" style="background:var(--color-cat-mint)"></span>薄荷 · 5 个</span>
  </div>
  <div class="cells">
    <div class="cell"><span class="pic" data-mark="todo" data-size="96" style="transform:rotate(-5deg)"></span><span class="nm">一步一步</span><span class="nid">todo</span></div>
    <div class="cell"><span class="pic" data-mark="notes" data-size="96" style="transform:rotate(4deg)"></span><span class="nm">念念不忘</span><span class="nid">notes</span></div>
    <div class="cell"><span class="pic" data-mark="days" data-size="96" style="transform:rotate(-3deg)"></span><span class="nm">来日方长</span><span class="nid">days</span></div>
    <div class="cell"><span class="pic" data-mark="finance" data-size="96" style="transform:rotate(6deg)"></span><span class="nm">钱来钱往</span><span class="nid">finance</span></div>
    <div class="cell"><span class="pic" data-mark="packing" data-size="96" style="transform:rotate(-4deg)"></span><span class="nm">出门走走</span><span class="nid">packing</span></div>
  </div>
</section>

<section class="row" style="top:366px" aria-label="兴趣">
  <div class="rowhead">
    <span class="label" data-tape="1">兴趣</span>
    <span class="meta"><span class="dot" style="background:var(--color-cat-pink)"></span>樱粉 · 5 个</span>
  </div>
  <div class="cells">
    <div class="cell"><span class="pic" data-mark="books" data-size="96" style="transform:rotate(5deg)"></span><span class="nm">摸鱼读读</span><span class="nid">books</span></div>
    <div class="cell"><span class="pic" data-mark="films" data-size="96" style="transform:rotate(-6deg)"></span><span class="nm">好奇看看</span><span class="nid">films</span></div>
    <div class="cell"><span class="pic" data-mark="drawing" data-size="96" style="transform:rotate(3deg)"></span><span class="nm">随意画画</span><span class="nid">drawing</span></div>
    <div class="cell"><span class="pic" data-mark="site" data-size="96" style="transform:rotate(-4deg)"></span><span class="nm">呦呦漫游</span><span class="nid">site</span></div>
    <div class="cell"><span class="pic" data-mark="canvas" data-size="96" style="transform:rotate(5deg)"></span><span class="nm">有板有眼</span><span class="nid">canvas</span></div>
  </div>
</section>

<p class="foot">十个都是照 DESIGN.md 的「贴纸」画法重画的：64 格、墨线 3.3、填色错开 1.4 / 1.8、白边 4.2。没有用 marks/modules 里的路径。</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"palette":{"editor":"enum","options":["blue","purple","kraft","yellow","mint"],"default":"blue","section":"配色"},"dark":{"editor":"boolean","default":false,"section":"配色"},"$preview":{"width":1200,"height":620}}'>
const COL = {
  ink: 'var(--color-art-ink)',
  white: 'var(--color-art-white)',
  shadow: 'var(--color-art-shadow)',
  blush: 'var(--color-blush)',
  cats: { mint: 'var(--color-cat-mint)', sky: 'var(--color-cat-sky)', pink: 'var(--color-cat-pink)', orange: 'var(--color-cat-orange)', grape: 'var(--color-cat-grape)' },
  catLight: (c) => 'var(--color-cat-' + c + '-sticker)',
  yellow: 'var(--color-yuzu)',
  leaf: 'var(--color-leaf)',
  heart: 'var(--color-heart)'
};

// 胶带：Pomelo.hand.tape 的默认色是 App 里的 --tape-a0 / --tape-b0（Design System 的画布上没有这两个变量），
// 这里显式传 token 里的颜色，薄荷和柚黄两种。
const TAPE = [
  ['var(--color-tape-mint-a)', 'var(--color-tape-mint-b)'],
  ['var(--color-tape-yuzu-a)', 'var(--color-tape-yuzu-b)']
];

// 每个图标都是这一版自己画的几何：64 格、viewBox -8 -8 80 80。形状用 Design System 同一套手画零件（Pomelo.hand）抖出墨线，
// 填色、白边、投影由 stickerSvg 一层层加上去；种子固定，两次打开画出来一样。
function marks() {
  const H = Pomelo.hand;
  const circ = H.circle, ell = H.ellipse, rr = H.rrect, rot = H.rotate, P = H.P;
  return {
    // 一步一步：两只脚，前一只在前、后一只在后，脚尖都朝右上

      { t: 'shape', d: ell(20, 42, 6.4, 10.4, 18), fill: 'cat', seed: 11 },
      { t: 'shape', d: ell(16.4, 50.5, 4.3, 4.6, 18), fill: 'cat', sw: 0.8, seed: 12 },
      { t: 'shape', d: ell(26, 30.4, 2.5, 2.7, 18), fill: 'cat', sw: 0.7, amp: 0.4, seed: 13 },
      { t: 'shape', d: ell(22.4, 28.9, 2.3, 2.5, 18), fill: 'cat', sw: 0.7, amp: 0.4, seed: 14 },
      { t: 'shape', d: ell(18.6, 29.2, 2.1, 2.3, 18), fill: 'cat', sw: 0.7, amp: 0.4, seed: 15 },
      { t: 'shape', d: ell(43, 23, 6.4, 10.4, 18), fill: 'cat', seed: 16 },
      { t: 'shape', d: ell(39.4, 31.5, 4.3, 4.6, 18), fill: 'cat', sw: 0.8, seed: 17 },
      { t: 'shape', d: ell(49, 11.4, 2.5, 2.7, 18), fill: 'cat', sw: 0.7, amp: 0.4, seed: 18 },
      { t: 'shape', d: ell(45.4, 9.9, 2.3, 2.5, 18), fill: 'cat', sw: 0.7, amp: 0.4, seed: 19 },
      { t: 'shape', d: ell(41.6, 10.2, 2.1, 2.3, 18), fill: 'cat', sw: 0.7, amp: 0.4, seed: 20 }
    ] },
    // 念念不忘：一张折了角的便条，写了两行，右下角一颗心
    notes: { cat: 'mint', parts: [
      { t: 'shape', d: P('M14 10 L44 10 L52 18 L52 53 Q52 56 49 56 L14 56 Q11 56 11 53 L11 13 Q11 10 14 10 Z'), fill: 'cat', seed: 31 },
      { t: 'shape', d: P('M44 10 L52 18 L46 18 Q44 18 44 16 Z'), fill: 'catLight', sw: 0.8, seed: 32 },
      { t: 'line', d: P('M17 25 L42 25 M17 32 L38 32'), sw: 0.7, seed: 33 },
      { t: 'shape', d: P('M32 48.5 C27.5 45.2 24.5 42.4 24.5 39.4 C24.5 37 26.4 35.1 28.8 35.1 C30.5 35.1 31.6 36 32 37.3 C32.4 36 33.5 35.1 35.2 35.1 C37.6 35.1 39.5 37 39.5 39.4 C39.5 42.4 36.5 45.2 32 48.5 Z'), fill: 'heart', sw: 0.75, amp: 0.4, seed: 34 },

      { t: 'shape', d: P('M10 25 Q10 15 20 15 L44 15 Q54 15 54 25 L54 28 L10 28 Z'), fill: 'cat', seed: 52 },

      { t: 'dot', d: circ(21, 36, 1.6), seed: 54 },
      { t: 'dot', d: circ(32, 36, 1.6), seed: 55 },
      { t: 'dot', d: circ(43, 36, 1.6), seed: 56 },
      { t: 'dot', d: circ(21, 46, 1.6), seed: 57 },
      { t: 'shape', d: circ(33, 46, 5.2), fill: 'yellow', sw: 0.8, amp: 0.4, seed: 58 },
      { t: 'dot', d: circ(43, 46, 1.6), seed: 59 }
    ] },
    // 钱来钱往：钱包，搭扣浅浅一档，右上角一枚硬币
    finance: { cat: 'mint', parts: [
      { t: 'shape', d: P('M9 25 Q9 20 14 20 L50 20 Q55 20 55 25 L55 47 Q55 52 50 52 L14 52 Q9 52 9 47 Z'), fill: 'cat', seed: 71 },
      { t: 'line', d: P('M9 32 C22 29 42 29 55 32'), sw: 0.75, seed: 72 },
      { t: 'shape', d: rr(37, 34, 16, 12, 4), fill: 'catLight', sw: 0.9, seed: 73 },
      { t: 'dot', d: circ(46, 40, 1.9), seed: 74 },
      { t: 'shape', d: circ(43, 13, 7.5), fill: 'yellow', seed: 75 },
      { t: 'line', d: P('M40 10.5 L43 13.5 L46 10.5 M43 13.5 L43 18 M40.4 15 L45.6 15'), sw: 0.65, seed: 76 }

      { t: 'line', d: P('M19 22 L19 54 M45 22 L45 54'), sw: 0.8, seed: 93 },
      { t: 'shape', d: rr(29, 33, 12, 8, 3), fill: 'yellow', sw: 0.8, seed: 94 },

      { t: 'line', d: P('M14 26 C18 25 22 25 26 27 M14 33 C18 32 22 32 26 34'), sw: 0.7, seed: 114 },
      { t: 'line', d: P('M38 27 C42 25 46 25 50 26 M38 34 C42 32 46 32 50 33'), sw: 0.7, seed: 115 },
      { t: 'shape', d: P('M35 7 L45 7 L45 21 L40 17.5 L35 21 Z'), fill: 'yellow', seed: 116 }
    ] },
    // 好奇看看：场记板，上面一块歪着的柚黄板、三道白斜线，下面一个播放三角
    films: { cat: 'pink', parts: [
      { t: 'shape', d: rr(9, 26, 46, 28, 5), fill: 'cat', seed: 131 },
      { t: 'shape', d: rot(rr(8, 14, 48, 10, 3), 32, 19, -10), fill: 'yellow', seed: 132 },
      { t: 'line', d: rot(P('M17 15 L21 23 M27 14 L31 22 M37 13 L41 21 M47 12 L51 20'), 32, 19, -10), sw: 0.75, seed: 133 },
      { t: 'shape', d: P('M27 34 L40 40.5 L27 47 Z'), fill: 'white', sw: 0.8, amp: 0.4, seed: 134 }
    ] },
    // 随意画画：一块圆调色盘，拇指孔、三个颜色点，左下斜放一支笔
    drawing: { cat: 'pink', parts: [
      { t: 'shape', d: circ(31, 31, 22), fill: 'cat', seed: 151 },
      { t: 'shape', d: circ(43, 41, 5), fill: 'white', sw: 0.8, amp: 0.4, seed: 152 },
      { t: 'shape', d: circ(20, 23, 4.4), fill: 'yellow', sw: 0.75, amp: 0.4, seed: 153 },

    ] },
    // 呦呦漫游：一颗地球，经线纬线，右上角一架纸飞机

      { t: 'shape', d: circ(30, 35, 20), fill: 'cat', seed: 171 },
      { t: 'line', d: ell(30, 35, 8, 20), sw: 0.7, seed: 172 },
      { t: 'line', d: ell(30, 35, 15, 20, 0), sw: 0.6, seed: 173 },
      { t: 'line', d: P('M10.6 30 C20 33 40 33 49.4 30 M10.6 40 C20 37 40 37 49.4 40'), sw: 0.7, seed: 174 },
      { t: 'shape', d: P('M40 8 L59 12 L49 22 Z'), fill: 'white', sw: 0.8, amp: 0.4, seed: 175 },
      { t: 'line', d: P('M49 22 L47 15'), sw: 0.6, seed: 176 }
    ] },
    // 有板有眼：画架，画纸里一座山、一颗太阳，下面三条腿和横撑
    canvas: { cat: 'pink', parts: [
      { t: 'line', d: P('M25 41 L16 58 M39 41 L48 58 M32 45 L32 55'), sw: 1.1, seed: 191 },
      { t: 'shape', d: rr(8, 8, 48, 34, 5), fill: 'cat', seed: 192 },
      { t: 'shape', d: rr(14, 14, 36, 22, 2.5), fill: 'white', sw: 0.8, seed: 193 },
      { t: 'shape', d: P('M15 33 L25 23 L31 28 L37 24 L49 33 Z'), fill: 'catLight', sw: 0.7, amp: 0.45, seed: 194 },
      { t: 'shape', d: circ(41, 20, 3.4), fill: 'yellow', sw: 0.7, amp: 0.35, seed: 195 },
      { t: 'line', d: P('M21 52 L43 52'), sw: 0.9, seed: 196 }
    ] }
  };
}

function draw() {
  const list = marks();
  const st = Pomelo.params.sticker;
  document.querySelectorAll('[data-mark]').forEach(function (el) {
    const art = list[el.dataset.mark];
    if (!art) return;
    el.innerHTML = Pomelo.hand.stickerSvg(art, st, COL, { size: Number(el.dataset.size) || 96, idp: 'pkm-' + el.dataset.mark });
  });
  document.querySelectorAll('[data-tape]').forEach(function (el) {
    const kind = Number(el.dataset.tape) || 0;
    el.insertAdjacentHTML('afterbegin', Pomelo.hand.tape({ x: -8, y: 0, w: 88, h: 28, rot: kind ? 3 : -4, kind: kind, colors: TAPE }));
  });
}

class Component extends DCLogic {
  renderVals() { return { palette: this.props.palette ?? 'blue', theme: this.props.dark ? 'dark' : 'light' }; }
  componentDidMount() { draw(); this.stop = Pomelo.paintLive(document.body); }
  componentDidUpdate() { draw(); Pomelo.paint(document.body); }
  componentWillUnmount() { this.stop && this.stop(); }
}
</script>
</body>
</html>
