<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>前十个模块 · 贴纸图标</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/pomelo/tokens.css">
<link rel="stylesheet" href="ds/pomelo/components/bundle.css">
<script src="ds/pomelo/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.root{position:relative;width:1200px;height:600px;overflow:hidden;background:var(--color-desk);color:var(--color-ink);font-family:var(--font-hand)}
.deskbg{position:absolute;inset:0}
.title{position:absolute;left:48px;top:28px;font-size:26px;line-height:34px;font-weight:700}
.title small{font-size:14px;color:var(--color-ink-soft);font-weight:400;margin-left:12px}
.rowcard{position:absolute;left:40px;width:1120px;height:216px}
.rowcard .inner{position:absolute;inset:0;display:flex;align-items:center;padding:0 24px 0 36px}
.lab{position:relative;width:104px;height:30px;flex:none;margin-right:20px;font-size:16px;line-height:30px;text-align:center;color:#20241F;font-weight:700}
.tp{position:absolute;inset:0;opacity:.88;clip-path:polygon(0 0,6px 12.5%,0 25%,6px 37.5%,0 50%,6px 62.5%,0 75%,6px 87.5%,0 100%,100% 100%,calc(100% - 6px) 87.5%,100% 75%,calc(100% - 6px) 62.5%,100% 50%,calc(100% - 6px) 37.5%,100% 25%,calc(100% - 6px) 12.5%,100% 0)}
.tp.m{background:repeating-linear-gradient(45deg,var(--color-tape-mint-a) 0 7px,var(--color-tape-mint-b) 7px 14px)}
.tp.y{background:repeating-linear-gradient(45deg,var(--color-tape-yuzu-a) 0 7px,var(--color-tape-yuzu-b) 7px 14px)}
.lab .tx{position:relative}
.cell{width:184px;flex:none;display:flex;flex-direction:column;align-items:center;gap:8px}
.stk{display:block;width:96px;height:96px;line-height:0}
.stk svg{display:block;overflow:visible}
.nm{font-size:18px;line-height:26px;font-weight:700}
.id{font-size:12px;line-height:16px;color:var(--color-ink-soft);margin-top:-6px}
</style>
</helmet>
<div class="pm root" data-palette="blue" data-theme="light">
<div class="pm-desk deskbg" data-hand="desk" data-seed="31"></div>
<div class="title">前十个模块 · 贴纸<small>墨线、错开的填色、白边、轻投影，各歪一点</small></div>

<div class="rowcard" style="top:84px">
 <div class="pm-card" data-hand="card" data-seed="41" data-tilt="-0.6" style="position:absolute;inset:0"></div>
 <div class="inner">
  <div class="lab" style="transform:rotate(-4deg)"><span class="tp m"></span><span class="tx">日常</span></div>
  <div class="cell"><div class="stk" data-ico="todo" data-cat="mint" data-tilt="-5"></div><div class="nm">一步一步</div><div class="id">todo</div></div>
  <div class="cell"><div class="stk" data-ico="notes" data-cat="mint" data-tilt="4"></div><div class="nm">念念不忘</div><div class="id">notes</div></div>
  <div class="cell"><div class="stk" data-ico="days" data-cat="mint" data-tilt="-3"></div><div class="nm">来日方长</div><div class="id">days</div></div>
  <div class="cell"><div class="stk" data-ico="finance" data-cat="mint" data-tilt="6"></div><div class="nm">钱来钱往</div><div class="id">finance</div></div>
  <div class="cell"><div class="stk" data-ico="packing" data-cat="mint" data-tilt="-6"></div><div class="nm">出门走走</div><div class="id">packing</div></div>
 </div>
</div>

<div class="rowcard" style="top:324px">
 <div class="pm-card" data-hand="card" data-seed="42" data-tilt="0.7" style="position:absolute;inset:0"></div>
 <div class="inner">
  <div class="lab" style="transform:rotate(3deg)"><span class="tp y"></span><span class="tx">兴趣</span></div>
  <div class="cell"><div class="stk" data-ico="books" data-cat="pink" data-tilt="5"></div><div class="nm">摸鱼读读</div><div class="id">books</div></div>
  <div class="cell"><div class="stk" data-ico="films" data-cat="pink" data-tilt="-4"></div><div class="nm">好奇看看</div><div class="id">films</div></div>
  <div class="cell"><div class="stk" data-ico="drawing" data-cat="pink" data-tilt="3"></div><div class="nm">随意画画</div><div class="id">drawing</div></div>
  <div class="cell"><div class="stk" data-ico="site" data-cat="pink" data-tilt="-6"></div><div class="nm">呦呦漫游</div><div class="id">site</div></div>
  <div class="cell"><div class="stk" data-ico="canvas" data-cat="pink" data-tilt="5"></div><div class="nm">有板有眼</div><div class="id">canvas</div></div>
 </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":600}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
  componentDidMount() {
    const H = Pomelo.hand, P = H.P, rr = H.rrect, ci = H.circle, el = H.ellipse;
    const sh = (d, fill, sw) => ({ t: 'shape', d: typeof d === 'string' ? P(d) : d, fill, sw });
    const ln = (d, sw) => ({ t: 'line', d: typeof d === 'string' ? P(d) : d, sw: sw || 0.7 });
    const dt = (d, color) => ({ t: 'dot', d, color });
    const SKY = 'var(--color-cat-sky-sticker)', ORG = 'var(--color-cat-orange-sticker)';
    const heart = (cx, cy, s) => P('M' + cx + ' ' + (cy + 9 * s) + ' C' + (cx - 13 * s) + ' ' + (cy + 1 * s) + ' ' + (cx - 11 * s) + ' ' + (cy - 9 * s) + ' ' + (cx - 5 * s) + ' ' + (cy - 9 * s) + ' C' + (cx - 2 * s) + ' ' + (cy - 9 * s) + ' ' + cx + ' ' + (cy - 6 * s) + ' ' + cx + ' ' + (cy - 4 * s) + ' C' + cx + ' ' + (cy - 6 * s) + ' ' + (cx + 2 * s) + ' ' + (cy - 9 * s) + ' ' + (cx + 5 * s) + ' ' + (cy - 9 * s) + ' C' + (cx + 11 * s) + ' ' + (cy - 9 * s) + ' ' + (cx + 13 * s) + ' ' + (cy + 1 * s) + ' ' + cx + ' ' + (cy + 9 * s) + ' Z');
    const ART = {
      todo: [
        sh(rr(13, 9, 38, 48, 5), 'catLight'),
        sh(rr(23, 3, 18, 10, 3), 'yuzu'),
        ln('M20 25 L23 28 L28 21'), ln('M33 25 L44 25', 0.55),
        ln('M20 37 L23 40 L28 33'), ln('M33 37 L44 37', 0.55),
        sh(rr(20, 45, 8, 7, 2), 'white', 0.5), ln('M33 49 L41 49', 0.55)
      ],
      notes: [
        sh('M11 10 L53 10 L53 41 L40 55 L11 55 Z', 'yuzu'),
        sh('M40 55 L40 43 L53 41 Z', 'white', 0.6),
        ln('M19 19 L38 19', 0.55),
        sh(heart(30, 35, 1), 'heart', 0.7)
      ],
      days: [
        sh(rr(9, 12, 46, 44, 6), 'catLight'),
        sh(rr(9, 12, 46, 15, 6), 'cat'),
        ln('M21 6 L21 18', 1), ln('M43 6 L43 18', 1),
        sh(heart(32, 42, 0.85), 'heart', 0.6),
        dt(ci(18, 36, 1.3)), dt(ci(46, 36, 1.3)), dt(ci(18, 47, 1.3))
      ],
      finance: [
        sh(ci(42, 22, 13), 'cat'), ln('M42 16 L42 28', 0.5),
        sh(ci(28, 37, 20), 'yuzu'),
        ln(el(28, 37, 12, 12), 0.45),
        ln('M22 29 L28 38 L34 29'), ln('M28 38 L28 47', 0.7), ln('M22 40 L34 40', 0.55)
      ],
      packing: [
        ln('M23 22 L23 12 L41 12 L41 22', 0.9),
        sh(rr(8, 20, 48, 35, 7), 'cat'),
        ln('M21 21 L21 54', 0.55), ln('M43 21 L43 54', 0.55),
        sh(rr(27, 33, 10, 8, 2), 'yuzu', 0.7),
        dt(ci(15, 58, 1.8)), dt(ci(49, 58, 1.8))
      ],
      books: [
        sh('M6 17 C16 12 25 14 32 20 L32 54 C25 48 16 46 6 51 Z', 'catLight'),
        sh('M58 17 C48 12 39 14 32 20 L32 54 C39 48 48 46 58 51 Z', 'cat'),
        ln('M12 26 C16 25 21 26 25 29', 0.5), ln('M12 34 C16 33 21 34 25 37', 0.5),
        ln('M39 29 C43 26 48 25 52 26', 0.5), ln('M39 37 C43 34 48 33 52 34', 0.5),
        sh('M44 11 L52 12 L52 29 L48 25 L44 29 Z', 'yuzu', 0.6)
      ],
      films: [
        sh(rr(9, 26, 46, 30, 4), 'cat'),
        sh('M9 25 L8 15 L55 8 L55 19 Z', 'white'),
        ln('M17 22 L21 12', 0.55), ln('M29 20 L33 10', 0.55), ln('M41 18 L45 8', 0.55),
        sh('M27 35 L27 49 L40 42 Z', 'yuzu', 0.6)
      ],
      drawing: [
        sh('M32 7 C48 7 59 17 59 30 C59 40 51 43 45 40 C39 37 36 43 40 50 C43 56 37 58 32 58 C16 58 5 46 5 32 C5 17 17 7 32 7 Z', 'catLight'),
        sh(ci(21, 26, 5), 'heart', 0.6), sh(ci(33, 17, 5), 'yuzu', 0.6),
        sh(ci(46, 24, 5), SKY, 0.6), sh(ci(18, 41, 4.5), ORG, 0.6)
      ],
      site: [
        sh(ci(29, 36, 22), 'catLight'),
        ln(el(29, 36, 9, 22), 0.5), ln('M7 36 L51 36', 0.5),
        ln('M11 24 C21 28 37 28 47 24', 0.5), ln('M11 48 C21 44 37 44 47 48', 0.5),
        sh('M47 6 C53 6 57 10 57 15 C57 22 47 31 47 31 C47 31 37 22 37 15 C37 10 41 6 47 6 Z', 'heart', 0.8),
        dt(ci(47, 15, 3), 'white')
      ],
      canvas: [
        ln('M20 40 L13 58', 1), ln('M44 40 L51 58', 1), ln('M32 40 L32 58', 1),
        sh(rr(8, 8, 48, 36, 4), 'catLight'),
        sh(ci(43, 19, 4.5), 'yuzu', 0.6),
        ln('M14 37 C19 24 25 22 30 30 C34 36 40 28 50 36', 0.8),
        dt(ci(22, 15, 1.2)), dt(ci(28, 15, 1.2))
      ]
    };
    const col = {
      ink: 'var(--color-art-ink)', white: 'var(--color-art-white)', shadow: 'var(--color-art-shadow)', blush: 'var(--color-blush)',
      yuzu: 'var(--color-yuzu)', heart: 'var(--color-heart)',
      cats: { mint: 'var(--color-cat-mint)', pink: 'var(--color-cat-pink)', sky: 'var(--color-cat-sky)', orange: 'var(--color-cat-orange)', grape: 'var(--color-cat-grape)' },
      catLight: (c) => 'var(--color-cat-' + c + '-sticker)'
    };
    let n = 0;
    document.querySelectorAll('[data-ico]').forEach((host) => {
      const parts = ART[host.dataset.ico].map((p, i) => Object.assign({}, p, { seed: 100 + (++n) * 7 + i }));
      host.innerHTML = H.svg({ cat: host.dataset.cat, parts }, Pomelo.params.sticker, col, { size: 96, idp: 'm' + host.dataset.ico, label: host.dataset.ico });
      host.style.transform = 'rotate(' + host.dataset.tilt + 'deg)';
    });
    this.stop = Pomelo.paintLive(document.body);
  }
  componentWillUnmount() { this.stop && this.stop(); }
}
</script>
</body>
</html>
