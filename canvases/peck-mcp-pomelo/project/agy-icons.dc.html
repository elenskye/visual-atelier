<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>前十个模块的图标</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/pomelo/tokens.css">
<link rel="stylesheet" href="ds/pomelo/components/bundle.css">
<script src="ds/pomelo/components/bundle.js"></script>
<script src="./agy-pomelo-art.js"></script>
</head>
<body class="pm pm-desk">
<x-dc>
<helmet>
<style>
html, body { margin: 0; padding: 0; width: 1200px; height: 660px; overflow: hidden; }
.stage {
  position: relative;
  width: 1200px;
  height: 660px;
  padding: 26px 36px;
  overflow: hidden;
}
.book-sheet {
  position: relative;
  width: 1128px;
  height: 608px;
  padding: 22px 32px 22px 46px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.head-bar {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding-bottom: 6px;
}
.head-left {
  display: flex;
  align-items: baseline;
  gap: 14px;
}
.head-title {
  margin: 0;
  font-size: var(--text-page-title);
  line-height: 30px;
  font-weight: 700;
  color: var(--color-ink);
}
.head-sub {
  font-size: var(--text-small);
  line-height: 20px;
  color: var(--color-ink-soft);
}
.head-chips {
  display: flex;
  align-items: center;
  gap: 10px;
}
.cat-section {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.cat-header {
  display: flex;
  align-items: center;
  gap: 12px;
}
.tape-badge {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 28px;
  padding: 0 14px;
  font-size: var(--text-body);
  font-weight: 700;
  color: var(--color-on-sticky);
  isolation: isolate;
}
.tape-badge::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  border-radius: 3px;
  box-shadow: 0 1px 2px var(--color-shadow);
}
.tape-badge--mint::before {
  background: repeating-linear-gradient(
    -45deg,
    var(--color-tape-mint-a) 0 7px,
    var(--color-tape-mint-b) 7px 14px
  );
  transform: rotate(-1.8deg);
}
.tape-badge--yuzu::before {
  background: repeating-linear-gradient(
    -45deg,
    var(--color-tape-yuzu-a) 0 7px,
    var(--color-tape-yuzu-b) 7px 14px
  );
  transform: rotate(1.5deg);
}
.cat-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
  flex: none;
}
.cat-note {
  font-size: var(--text-caption);
  line-height: 18px;
  color: var(--color-ink-soft);
}
.icon-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 18px;
}
.icon-cell {
  position: relative;
  height: 200px;
  padding: 16px 12px 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
}
.icon-cell > [data-hand-painted] {
  background: var(--color-card);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-note);
}
.sticker-slot {
  width: 104px;
  height: 104px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.sticker-tilt {
  width: 96px;
  height: 96px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.icon-meta {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
.icon-name {
  font-size: var(--text-card-title);
  line-height: 22px;
  font-weight: 700;
  color: var(--color-ink);
  white-space: nowrap;
}
.icon-id {
  font-size: var(--text-caption);
  line-height: 16px;
  color: var(--color-ink-soft);
  white-space: nowrap;
}
</style>
</helmet>
<div class="stage" data-hand="desk" data-seed="1">
  <section class="pm-sheet book-sheet" data-hand="sheet" data-seed="2" data-tilt="-0.3" data-tapes="2" data-stitches>
    <header class="head-bar">
      <div class="head-left">
        <h1 class="head-title"><span class="pm-mark" data-hand="marker" data-seed="11" data-sw="12">前十个模块贴纸</span></h1>
        <span class="head-sub">贴纸簿默认顺序 · S3 线描贴纸（墨线 3.3 · 填色错开 · 模切白边 4.2 · 轻投影）</span>
      </div>
      <div class="head-chips">
        <span class="pm-chip pm-cat-mint">日常 · 薄荷 5</span>
        <span class="pm-chip pm-cat-pink">兴趣 · 樱粉 5</span>
      </div>
    </header>

    <div class="cat-section">
      <div class="cat-header">
        <span class="tape-badge tape-badge--mint"><span class="cat-dot" style="background:var(--color-cat-mint)"></span>日常 · 薄荷</span>
        <span class="cat-note">一步一步 · 念念不忘 · 来日方长 · 钱来钱往 · 出门走走</span>
      </div>
      <div class="icon-grid">
        <article class="icon-cell" data-hand="cell" data-seed="101" data-tilt="-0.9">
          <div class="sticker-slot"><span class="sticker-tilt" style="transform:rotate(-5.5deg)" data-pm-sticker="todo" data-pm-size="96"></span></div>
          <div class="icon-meta"><span class="icon-name">一步一步</span><span class="icon-id">todo</span></div>
        </article>
        <article class="icon-cell" data-hand="cell" data-seed="102" data-tilt="0.8">
          <div class="sticker-slot"><span class="sticker-tilt" style="transform:rotate(4.5deg)" data-pm-sticker="notes" data-pm-size="96"></span></div>
          <div class="icon-meta"><span class="icon-name">念念不忘</span><span class="icon-id">notes</span></div>
        </article>
        <article class="icon-cell" data-hand="cell" data-seed="103" data-tilt="-0.6">
          <div class="sticker-slot"><span class="sticker-tilt" style="transform:rotate(-3.8deg)" data-pm-sticker="days" data-pm-size="96"></span></div>
          <div class="icon-meta"><span class="icon-name">来日方长</span><span class="icon-id">days</span></div>
        </article>
        <article class="icon-cell" data-hand="cell" data-seed="104" data-tilt="1.1">
          <div class="sticker-slot"><span class="sticker-tilt" style="transform:rotate(5.2deg)" data-pm-sticker="finance" data-pm-size="96"></span></div>
          <div class="icon-meta"><span class="icon-name">钱来钱往</span><span class="icon-id">finance</span></div>
        </article>
        <article class="icon-cell" data-hand="cell" data-seed="105" data-tilt="-0.8">
          <div class="sticker-slot"><span class="sticker-tilt" style="transform:rotate(-4.6deg)" data-pm-sticker="packing" data-pm-size="96"></span></div>
          <div class="icon-meta"><span class="icon-name">出门走走</span><span class="icon-id">packing</span></div>
        </article>
      </div>
    </div>

    <div class="cat-section">
      <div class="cat-header">
        <span class="tape-badge tape-badge--yuzu"><span class="cat-dot" style="background:var(--color-cat-pink)"></span>兴趣 · 樱粉</span>
        <span class="cat-note">摸鱼读读 · 好奇看看 · 随意画画 · 呦呦漫游 · 有板有眼</span>
      </div>
      <div class="icon-grid">
        <article class="icon-cell" data-hand="cell" data-seed="201" data-tilt="0.9">
          <div class="sticker-slot"><span class="sticker-tilt" style="transform:rotate(4.2deg)" data-pm-sticker="books" data-pm-size="96"></span></div>
          <div class="icon-meta"><span class="icon-name">摸鱼读读</span><span class="icon-id">books</span></div>
        </article>
        <article class="icon-cell" data-hand="cell" data-seed="202" data-tilt="-1.0">
          <div class="sticker-slot"><span class="sticker-tilt" style="transform:rotate(-5.0deg)" data-pm-sticker="films" data-pm-size="96"></span></div>
          <div class="icon-meta"><span class="icon-name">好奇看看</span><span class="icon-id">films</span></div>
        </article>
        <article class="icon-cell" data-hand="cell" data-seed="203" data-tilt="0.7">
          <div class="sticker-slot"><span class="sticker-tilt" style="transform:rotate(3.8deg)" data-pm-sticker="drawing" data-pm-size="96"></span></div>
          <div class="icon-meta"><span class="icon-name">随意画画</span><span class="icon-id">drawing</span></div>
        </article>
        <article class="icon-cell" data-hand="cell" data-seed="204" data-tilt="-0.8">
          <div class="sticker-slot"><span class="sticker-tilt" style="transform:rotate(-4.4deg)" data-pm-sticker="site" data-pm-size="96"></span></div>
          <div class="icon-meta"><span class="icon-name">呦呦漫游</span><span class="icon-id">site</span></div>
        </article>
        <article class="icon-cell" data-hand="cell" data-seed="205" data-tilt="1.0">
          <div class="sticker-slot"><span class="sticker-tilt" style="transform:rotate(4.8deg)" data-pm-sticker="canvas" data-pm-size="96"></span></div>
          <div class="icon-meta"><span class="icon-name">有板有眼</span><span class="icon-id">canvas</span></div>
        </article>
      </div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":660}}'>
class Component extends DCLogic {
  componentDidMount() {
    if (window.PomeloArt) window.PomeloArt.renderStickers(document.body);
    if (window.Pomelo) this.stop = window.Pomelo.paintLive(document.body);
  }
  componentDidUpdate() {
    if (window.PomeloArt) window.PomeloArt.renderStickers(document.body);
    if (window.Pomelo) window.Pomelo.paint(document.body);
  }
  componentWillUnmount() {
    if (this.stop) this.stop();
  }
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
