<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>R3 · 全部带纸片</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500&amp;family=Noto+Serif+SC:wght@400&amp;family=Source+Serif+4:opsz,wght@8..60,400&amp;family=Work+Sans:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#28625d}a:hover{color:#bf2929}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); font-family: 'Work Sans', 'Noto Sans SC', sans-serif">
  <sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
    <div style="box-sizing: border-box; padding: 64px 56px; display: flex; flex-direction: column; gap: 32px; background: {{t.page}}; color: {{t.text}}">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <div style="font-size: 13px; line-height: 1.6; color: {{t.accent}}; text-transform: uppercase">{{t.eyebrow}}</div>
        <h2 style="margin: 0; font-family: 'Source Serif 4', 'Noto Serif SC', serif; font-weight: 400; font-size: 40px; line-height: 1.1">{{t.title}}</h2>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="font-size: 13px; color: {{t.muted}}">64px · 三笔 + 纸片</div>
        <div style="display: flex; gap: 32px">
          <sc-for list="{{t.big}}" as="src" hint-placeholder-count="6"><img src="{{src}}" alt="" style="width: 64px; height: 64px; display: block"></sc-for>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="font-size: 13px; color: {{t.muted}}">24px · 简笔 + 纸片</div>
        <div style="display: flex; gap: 72px; padding-left: 20px">
          <sc-for list="{{t.small}}" as="src" hint-placeholder-count="6"><img src="{{src}}" alt="" style="width: 24px; height: 24px; display: block"></sc-for>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="font-size: 13px; color: {{t.muted}}">大图 · 飞白 + 纸片</div>
        <img src="{{t.deco}}" alt="" style="width: 560px; height: 220px; display: block">
        <div style="display: flex; gap: 24px; align-items: flex-start">
          <div style="width: 320px; height: 168px; border: 1px solid {{t.soft}}; border-radius: 8px; overflow: hidden; box-sizing: border-box"><img src="{{t.og}}" alt="" style="width: 318px; height: 166px; display: block"></div>
          <div style="width: 240px; height: 168px; background: {{t.surface}}; border-radius: 8px; display: flex; align-items: center; justify-content: center"><img src="{{t.empty}}" alt="" style="width: 224px; height: 140px; display: block"></div>
        </div>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>

</body>
</html>
