<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>第一轮总览 · 浅色</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500&amp;family=Noto+Serif+SC:wght@400&amp;family=Source+Serif+4:opsz,wght@8..60,400&amp;family=Work+Sans:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#28625d}a:hover{color:#bf2929}
</style>
</helmet>
<div style="width: 1440px; height: 1100px; box-sizing: border-box; padding: 72px; background: #f6efe2; color: #1b1d1c; font-family: 'Work Sans', 'Noto Sans SC', sans-serif; display: flex; flex-direction: column; gap: 48px">
  <div style="display: flex; flex-direction: column; gap: 12px">
    <div style="font-size: 13px; line-height: 1.6; color: #2d6f6a; text-transform: uppercase">Round 1 · Light</div>
    <h1 style="margin: 0; font-family: 'Source Serif 4', 'Noto Serif SC', serif; font-weight: 400; font-size: 56px; line-height: 1.05">五个方向，同一套内容</h1>
  </div>
  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="display: grid; grid-template-columns: 150px repeat(6, 64px) 240px 200px 150px; column-gap: 16px; font-size: 13px; color: #686359; padding-bottom: 8px">
      <span>方向</span><span style="text-align: center">写作</span><span style="text-align: center">项目</span><span style="text-align: center">画廊</span><span style="text-align: center">创作</span><span style="text-align: center">游记</span><span style="text-align: center">其他</span><span>分区装饰</span><span>分享图</span><span>空状态</span>
    </div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
      <div style="display: grid; grid-template-columns: 150px repeat(6, 64px) 240px 200px 150px; column-gap: 16px; align-items: center; height: 136px">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <div style="font-family: 'Source Serif 4', 'Noto Serif SC', serif; font-size: 26px; line-height: 1.2">{{r.name}}</div>
          <div style="font-size: 13px; color: #686359">{{r.tag}}</div>
        </div>
        <sc-for list="{{r.icons}}" as="src" hint-placeholder-count="6">
          <img src="{{src}}" alt="" style="width: 64px; height: 64px; display: block">
        </sc-for>
        <div style="width: 240px; height: 94px; background: #fdf9f0; border-radius: 8px; overflow: hidden"><img src="{{r.deco}}" alt="" style="width: 240px; height: 94px; display: block"></div>
        <div style="width: 200px; height: 105px; background: #f6efe2; border: 1px solid #e6dfd3; border-radius: 8px; overflow: hidden; box-sizing: border-box"><img src="{{r.og}}" alt="" style="width: 198px; height: 103px; display: block"></div>
        <div style="width: 150px; height: 94px; background: #fdf9f0; border-radius: 8px; overflow: hidden"><img src="{{r.empty}}" alt="" style="width: 150px; height: 94px; display: block"></div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
