<title>R2 · 笔势的三个维度</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500&amp;family=Noto+Serif+SC:wght@400&amp;family=Source+Serif+4:opsz,wght@8..60,400&amp;family=Work+Sans:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#28625d}a:hover{color:#bf2929}
</style>
</helmet>
<div style="width: 1440px; height: 1260px; box-sizing: border-box; padding: 72px; background: #f6efe2; color: #1b1d1c; font-family: 'Work Sans', 'Noto Sans SC', sans-serif; display: flex; flex-direction: column; gap: 40px">
  <div style="display: flex; flex-direction: column; gap: 12px">
    <div style="font-size: 13px; line-height: 1.6; color: #2d6f6a; text-transform: uppercase">Round 2 · Brush</div>
    <h1 style="margin: 0; font-family: 'Source Serif 4', 'Noto Serif SC', serif; font-weight: 400; font-size: 56px; line-height: 1.05">一次只改一件事</h1>
  </div>
  <div style="display: grid; grid-template-columns: 160px 464px 204px 280px; column-gap: 40px; font-size: 13px; color: #686359">
    <span></span><span>64px · 写作 项目 画廊 创作 游记 其他</span><span>24px · 小尺寸</span><span>分区装饰</span>
  </div>
  <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="font-size: 13px; color: #2d6f6a">{{g.title}}</div>
      <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
        <div style="display: grid; grid-template-columns: 160px 464px 204px 280px; column-gap: 40px; align-items: center; height: 116px">
          <div style="display: flex; flex-direction: column; gap: 4px">
            <div style="font-family: 'Source Serif 4', 'Noto Serif SC', serif; font-size: 24px; line-height: 1.2">{{r.name}}</div>
            <div style="font-size: 13px; color: #686359">{{r.tag}}</div>
          </div>
          <div style="display: flex; gap: 16px">
            <sc-for list="{{r.icons}}" as="src" hint-placeholder-count="6">
              <img src="{{src}}" alt="" style="width: 64px; height: 64px; display: block">
            </sc-for>
          </div>
          <div style="display: flex; gap: 12px">
            <sc-for list="{{r.icons}}" as="src" hint-placeholder-count="6">
              <img src="{{src}}" alt="" style="width: 24px; height: 24px; display: block">
            </sc-for>
          </div>
          <div style="width: 280px; height: 110px; background: #fdf9f0; border-radius: 8px; overflow: hidden"><img src="{{r.deco}}" alt="" style="width: 280px; height: 110px; display: block"></div>
        </div>
      </sc-for>
    </div>
  </sc-for>
</div>
</x-dc>
