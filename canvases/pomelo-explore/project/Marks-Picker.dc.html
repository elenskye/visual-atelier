<div class="hd"><h1>选图标和颜色</h1><p>贴纸簿（模块坞）里右键一张贴纸 →「图标和颜色…」；新建五花八门、循序渐进时也是这一块。点一下就换，「恢复默认」回到它本来的贴纸和颜色。柚子瓣里只看贴纸，所以同一张贴纸配同一种颜色只给一个模块：别的模块在用的格子变淡、点不了（示意：「玩物有志」挑了游戏、樱粉，樱粉里那五张有模块在用）。</p></div>
