<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<link rel="stylesheet" href="ds/pomelo/components/bundle.css">
<script src="ds/pomelo/components/bundle.js"></script>
</head>
<body>

<helmet>
<style>
body{margin:0}
.root [hidden]{display:none !important}
.root{position:relative;overflow:hidden;background:var(--color-desk);color:var(--color-ink)}
.app{position:absolute;inset:0;--fs:17px;--lh:1.8;--mw:680px}
.row{display:flex;align-items:center}
.soft{color:var(--color-ink-soft)}
.mk svg,.ico svg{display:block}
.ico{display:inline-flex;flex:none;line-height:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}

/* ---------- 外框（照 pomelo-explore 外框 B3 的 Frame-Page） ---------- */
.topband{position:absolute;left:0;top:0;width:1280px;height:58px;z-index:4;background:var(--color-top)}
.bar{position:absolute;left:0;top:0;width:1280px;height:58px;z-index:40;color:var(--color-on-top)}
.lights i{position:absolute;top:19.5px;width:12px;height:12px;border-radius:50%;display:block}
.hub{position:absolute;left:76px;top:3px;width:56px;height:52px;display:grid;place-items:center;border-radius:14px}
.navb{position:absolute;top:15px;width:28px;height:28px;display:grid;place-items:center;border-radius:8px}
.navb:disabled{opacity:.3;cursor:default}
.tohome{position:absolute;left:204px;top:15px;width:104px;height:28px;color:#20241F;font-size:15px}
.tl{position:relative;z-index:1;height:100%;display:flex;align-items:center;justify-content:center;gap:4px;line-height:28px}
.right{position:absolute;right:10px;top:0;height:58px;display:flex;align-items:center;gap:8px}
.openlbl{font-size:12px;opacity:.7;margin-right:-2px}
.opens{display:flex;align-items:center}
.ob{position:relative;width:40px;height:48px;display:grid;place-items:center}
.ob .ul{position:absolute;left:6px;right:6px;bottom:3px;height:6px;opacity:0}
.ob.on .ul{opacity:1}
.datechip{position:relative;height:30px;padding:0 13px;display:flex;align-items:center;font-size:13px;white-space:nowrap;color:var(--color-ink);margin:0 4px}
.ib{width:32px;height:32px;display:grid;place-items:center;border-radius:9px}
.ask{width:42px;height:42px;display:grid;place-items:center;border-radius:11px}
.page{position:absolute;left:36px;top:70px;width:1140px;height:712px}
.page.st{z-index:calc(8 - var(--j));transform:translate(calc(22px * (var(--j) + 1)),calc(4px * var(--j))) rotate(calc(.6deg + .8deg * var(--j)))}
.page.front{z-index:10}
.page.st .sheet>*:not([data-hand-painted]){visibility:hidden}
.sheet{position:absolute;inset:0}
.slap{position:absolute;left:-22px;top:-30px;z-index:20;pointer-events:none}
.peek{position:absolute;left:1114px;top:calc(100px + 92px * var(--j, 0));z-index:2}
/* 子页的纸签（见字如面 · 设置），插在纸的上边 */
.ftabs{position:absolute;left:330px;top:-30px;height:40px;display:flex;gap:6px;z-index:1}
.ft{position:relative;height:40px;padding:0 18px;font-size:15px}
.ft-t{position:relative;display:block;line-height:30px}
.ft .ft-on{display:none;position:absolute;inset:0}
.ft .ft-off{position:absolute;inset:0}
.ft[aria-selected=true] .ft-on{display:block}
.ft[aria-selected=true] .ft-off{display:none}
.ft[aria-selected=true] .ft-t{font-weight:700}
/* 见字如面的贴纸：三个方案叠着，按 Tweaks 的 mark 显示一张 */
.var{display:none !important}
.root[data-mark=a] .var-a,.root[data-mark=b] .var-b,.root[data-mark=c] .var-c{display:inline-block !important}

/* ---------- 三栏：标签 | 列表和正文合在一张卡里 ---------- */
.cols{position:absolute;inset:20px 26px 22px 60px;display:flex;--wtx:var(--wt);--wlx:var(--wl);--gapx:16px}
.page[data-sub="1"] .cols{display:none}
.app[data-fold="1"] .cols{--wtx:0px;--gapx:0px}
.app[data-fold="2"] .cols{--wtx:0px;--gapx:0px;--wlx:0px}
.side{width:var(--wtx);margin-right:var(--gapx);flex:none;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.side,.mid{transition:width .3s cubic-bezier(.3,.7,.3,1),margin .3s cubic-bezier(.3,.7,.3,1)}
.app.dragging .side,.app.dragging .mid{transition:none}
.app[data-fold="1"] .side,.app[data-fold="2"] .side,.app[data-fold="2"] .mid{visibility:hidden;transition:width .3s cubic-bezier(.3,.7,.3,1),margin .3s cubic-bezier(.3,.7,.3,1),visibility 0s linear .3s}
.shead{display:flex;align-items:baseline;gap:10px;padding:0 0 12px 10px;min-width:0}
.shead .pm-sheet-title{font-size:26px;line-height:34px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow{position:relative;display:flex;align-items:center;gap:9px;width:100%;height:32px;padding:0 8px 0 10px;font-size:14px;text-align:left;border-radius:9px;white-space:nowrap}
.srow .pk{position:absolute;inset:1px 0;display:none}
.srow.on .pk{display:block}
.srow.on{font-weight:700}
.srow>*:not(.pk){position:relative}
.lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .n{flex:none;font-size:12px;color:var(--color-ink-soft);font-weight:400}
.srow .ico{color:var(--color-pen)}
.srule{border-top:1.5px dashed var(--color-line);margin:10px 6px 8px}
.tree .srow{height:30px}
.tw{width:12px;flex:none;display:inline-flex;justify-content:center;color:var(--color-ink-soft)}
.d1{padding-left:28px}
.book{position:relative;flex:1;min-width:0;display:flex;min-height:0}
.mid{width:var(--wlx);flex:none;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.mtop{display:flex;align-items:center;gap:8px;padding:12px 10px 10px 14px}
.mtop .pm-field{flex:1;min-width:0;height:38px}
.mtop .pm-field input{width:100%;min-width:0;background:none;border:0;outline:none;font-size:14px}
.rb{width:38px;height:38px;display:grid;place-items:center;color:var(--color-pen);flex:none}
.listwrap{position:relative;flex:1;min-height:0}
.list{position:absolute;inset:0 4px 6px 8px;overflow:hidden}
.nrow{position:relative;display:flex;gap:10px;width:100%;padding:10px 10px 11px;text-align:left;border-radius:10px}
.nrow+.nrow::before{content:'';position:absolute;left:10px;right:10px;top:-0.5px;border-top:1px dashed var(--color-line)}
.nrow .pk{position:absolute;inset:0;display:none}
.nrow.on .pk{display:block}
.nrow>*:not(.pk){position:relative}
.nrow.on::before,.nrow.on+.nrow::before{display:none}
.nmain{flex:1;min-width:0}
.ntitle{display:flex;align-items:center;gap:5px;font-size:15px;font-weight:700;line-height:21px;white-space:nowrap;overflow:hidden}
.ntitle span{overflow:hidden;text-overflow:ellipsis}
.ntitle .ico{color:var(--color-pen)}
.npre{margin-top:3px;font-size:13px;line-height:19px;color:var(--color-ink-soft);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ndate{margin-top:4px;font-size:12px;line-height:16px;color:var(--color-ink-soft)}
.nthumb{flex:none;width:54px;height:54px;border-radius:9px;overflow:hidden;align-self:center}
.nthumb svg{display:block}
.nlock{margin-top:4px;font-size:13px;color:var(--color-ink-soft)}
/* 列表和正文之间的虚线；它和卡片的左边都能拖 */
.vline{flex:none;width:0;margin:14px 0;border-left:1.5px dashed var(--color-line)}
.app[data-fold="2"] .vline{display:none}
.grip{position:absolute;top:0;bottom:0;width:12px;margin-left:-6px;cursor:col-resize;z-index:5;touch-action:none}
.grip::after{content:'';position:absolute;left:5px;top:40%;width:2px;height:20%;border-radius:1px;background:var(--color-pen);opacity:0;transition:opacity .15s}
.grip:hover::after,.app.dragging .grip.on::after{opacity:.55}
.gl{left:calc(var(--wtx) + var(--gapx))}
.gr{left:calc(var(--wtx) + var(--gapx) + var(--wlx))}
.app[data-fold="1"] .gl,.app[data-fold="2"] .gl,.app[data-fold="2"] .gr{display:none}

/* ---------- 正文 ---------- */
.ed{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;container-type:inline-size}
@container (max-width: 520px){.fbar .opt{display:none}}
.etop{display:flex;align-items:center;gap:2px;height:44px;padding:8px 12px 0 18px}
.etop .crumb{display:flex;align-items:center;gap:6px;min-width:0;font-size:13px;color:var(--color-ink-soft);margin-right:auto;white-space:nowrap}
.crumb-t{overflow:hidden;text-overflow:ellipsis}
.eb{position:relative;flex:none;width:32px;height:32px;display:grid;place-items:center;color:var(--color-pen);border-radius:9px}
.eb:hover{background:color-mix(in srgb,var(--color-selected) 70%,transparent)}
.eb.on{background:var(--color-selected)}
.unfocus{position:absolute;right:18px;top:16px;z-index:6;display:none}
.docwrap{position:relative;flex:1;min-height:0}
.doc{position:absolute;inset:0;overflow:hidden;padding:14px 38px 96px;font-family:var(--font-long);font-size:var(--fs);line-height:var(--lh)}
.doc>*{max-width:var(--mw);margin-left:auto !important;margin-right:auto !important}
.doc>*{margin-top:0;margin-bottom:0}
.doc h1{font-family:var(--font-hand);font-size:1.75em;line-height:1.3;font-weight:700}
.dmeta{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;margin-top:4px !important;font-family:var(--font-hand);font-size:.8em;line-height:1.5;color:var(--color-ink-soft)}
.doc h2{font-family:var(--font-hand);font-size:1.3em;line-height:1.4;font-weight:700;margin-top:1.1em}
.doc h3{font-family:var(--font-hand);font-size:1.08em;line-height:1.5;font-weight:700;margin-top:.7em}
.doc p,.doc ul,.doc ol,.doc .todo,.doc blockquote,.doc .call,.doc pre,.doc .tbl,.doc .pic,.doc .fold,.doc .math,.doc .mer{margin-top:.6em}
.doc ul,.doc ol{padding-left:1.4em}
.doc ul li::marker{color:var(--color-pen)}
.doc ol li::marker{color:var(--color-pen);font-family:var(--font-hand)}
.hash{position:relative;display:inline-block;font-family:var(--font-hand);font-size:.85em;color:var(--color-ink);line-height:1.6;z-index:0}
.hash::after{content:'';position:absolute;left:-1px;right:-1px;bottom:.2em;height:.45em;border-radius:3px;background:var(--color-marker);opacity:.75;z-index:-1}
.mkd{color:var(--color-ink-soft);opacity:.55;font-weight:400;font-family:var(--font-hand)}
.caret{display:inline-block;width:2px;height:1.15em;margin:0 1px -.22em;background:var(--color-pen);border-radius:1px;animation:caret 1.1s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
.hl{padding:0 2px;border-radius:4px;background:linear-gradient(transparent 26%,color-mix(in srgb,var(--hl,var(--color-marker)) 82%,transparent) 26%,color-mix(in srgb,var(--hl,var(--color-marker)) 82%,transparent) 94%,transparent 94%);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hl.g{--hl:var(--color-cat-mint-bg)}.hl.b{--hl:var(--color-cat-sky-bg)}.hl.r{--hl:var(--color-cat-pink-bg)}.hl.p{--hl:var(--color-cat-grape-bg)}
.doc u{text-decoration:underline;text-decoration-color:var(--color-pen);text-decoration-thickness:1.5px;text-underline-offset:4px}
.doc del{text-decoration-thickness:1.5px;color:var(--color-ink-soft)}
.doc em{font-style:italic}
.doc code{font-family:ui-monospace,Menlo,monospace;font-size:.82em;padding:1px 5px;border-radius:5px;background:color-mix(in srgb,var(--color-desk) 75%,transparent)}
.wl{color:var(--color-link);text-decoration:underline dotted;text-decoration-thickness:1.5px;text-underline-offset:4px}
.wl .mkd{color:var(--color-link)}
.fn{font-size:.65em;vertical-align:.45em;color:var(--color-link);font-family:var(--font-hand);margin-left:1px}
.todo{display:flex;flex-direction:column;gap:2px}
.todo .pm-check{min-height:1.9em;font-size:1em;gap:10px}
.doc blockquote{position:relative;padding-left:16px;color:var(--color-ink-soft)}
.doc blockquote::before{content:'';position:absolute;left:2px;top:4px;bottom:4px;width:3px;border-radius:2px;background:color-mix(in srgb,var(--color-pen) 45%,transparent)}
.call{position:relative;padding:10px 14px 11px;border-radius:12px;background:var(--color-cat-sky-tint)}
.call.tip{background:var(--color-cat-mint-tint)}
.chd{display:flex;align-items:center;gap:6px;font-family:var(--font-hand);font-size:.85em;font-weight:700;line-height:1.6;color:var(--color-ink)}
.chd .ico{color:var(--color-pen)}
.call p{margin-top:2px}
.doc pre{position:relative;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--color-desk) 70%,transparent);font-family:ui-monospace,Menlo,monospace;font-size:.76em;line-height:1.65;white-space:pre;overflow:hidden}
.doc pre code{padding:0;background:none;font-size:inherit}
.plang{position:absolute;right:10px;top:7px;display:flex;align-items:center;gap:6px;font-family:var(--font-hand);font-size:12px;color:var(--color-ink-soft)}
.k{color:var(--color-pen);font-weight:700}.s{color:var(--color-up)}.fnn{color:var(--color-link)}.c{color:var(--color-ink-soft);font-style:italic}
.tbl{width:100%;border-collapse:collapse;font-size:.88em;line-height:1.6}
.tbl th{font-family:var(--font-hand);font-weight:700;text-align:left;padding:4px 8px;border-bottom:1.5px solid var(--color-line)}
.tbl td{padding:5px 8px;border-top:1px dashed var(--color-line)}
.tbl tr:nth-child(2) td{border-top:0}
.tbl .r{text-align:right;font-family:var(--font-hand);font-variant-numeric:tabular-nums}
.tbl tfoot td{border-top:1.5px solid var(--color-line);font-weight:700}
.pic{display:block}
.pic .ph{width:fit-content;border-radius:12px;overflow:hidden;line-height:0}
.pic figcaption{margin-top:5px;font-family:var(--font-hand);font-size:12px;line-height:16px;color:var(--color-ink-soft)}
.fold{display:flex;align-items:center;gap:6px;font-family:var(--font-hand);font-size:1.08em;line-height:1.5;font-weight:700}
.fold .more{font-weight:400;font-size:.75em;color:var(--color-ink-soft)}
.math{text-align:center;font-family:'Times New Roman',Times,serif;font-size:1.12em;font-style:italic;line-height:1.5}
.math .fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.85em;line-height:1.25}
.math .fr>span+span{border-top:1.2px solid currentColor}
.mer{display:flex !important;align-items:center;justify-content:center;padding:12px 0 6px}
.mbox{position:relative;padding:5px 14px;font-family:var(--font-hand);font-size:14px;line-height:22px;white-space:nowrap}
.marr{width:38px;height:14px;color:var(--color-pen)}
.fns{margin-top:1.4em !important;padding-top:8px;border-top:1.5px dashed var(--color-line);font-size:.75em;line-height:1.7;color:var(--color-ink-soft)}
.back{margin-top:1em !important}
.bh{display:flex;align-items:center;gap:6px;font-family:var(--font-hand);font-size:.85em;font-weight:700;color:var(--color-ink)}
.bl{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:.8em;line-height:1.6}
.bl .soft{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sel{background:color-mix(in srgb,var(--color-primary) 26%,transparent);border-radius:2px}

/* ---------- 格式条：一直在的时候也浮在正文上 ---------- */
.app:has(.doc[data-doc=letter]:not([hidden])) .fbar{opacity:.35;pointer-events:none}
.fbar{position:absolute;left:0;right:0;bottom:16px;margin:0 auto;width:max-content;max-width:calc(100% - 28px);z-index:4;display:flex;align-items:center;gap:1px;height:44px;padding:0 8px;filter:drop-shadow(0 6px 14px var(--color-shadow))}
.app[data-bar=select] .fbar{display:none}
.fb{position:relative;height:32px;min-width:28px;padding:0 2px;display:inline-flex;align-items:center;justify-content:center;gap:1px;color:var(--color-pen);border-radius:8px}
.fb:hover,.fb.on{background:var(--color-selected)}
.fb .dn{color:var(--color-ink-soft)}
.fsep{width:1px;height:18px;margin:0 4px;background:var(--color-line)}
.fdot{width:9px;height:9px;border-radius:50%;background:var(--color-marker);margin-left:-3px;margin-top:12px;border:1.5px solid var(--color-card)}
.float{position:absolute;z-index:30;display:none;align-items:center;gap:1px;height:40px;padding:0 6px;filter:drop-shadow(0 6px 12px var(--color-shadow))}
.app[data-bar=select] .float.show{display:flex}
.float .fb{height:30px}
.float::after{content:'';position:absolute;left:50%;bottom:-6px;width:12px;height:12px;margin-left:-6px;background:var(--color-card);border-right:1.6px solid var(--color-pen);border-bottom:1.6px solid var(--color-pen);transform:rotate(45deg);border-bottom-right-radius:3px}

/* ---------- 专心写：占满整个窗口，只剩正文、右上角的缩小和格式条 ---------- */
.app[data-focus=on] .bar,.app[data-focus=on] .topband,.app[data-focus=on] .page.st,.app[data-focus=on] .pm-desk,.app[data-focus=on] .slap,.app[data-focus=on] .ftabs,.app[data-focus=on] .side,.app[data-focus=on] .mid,.app[data-focus=on] .vline,.app[data-focus=on] .grip,.app[data-focus=on] .etop{display:none}
.app[data-focus=on] .page.front{left:0;top:0;width:100%;height:100%}
.app[data-focus=on] .sheet{background-color:var(--color-paper);background-image:linear-gradient(color-mix(in srgb,var(--color-grid) 70%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--color-grid) 70%,transparent) 1px,transparent 1px);background-size:22px 22px}
.app[data-focus=on] .sheet>[data-hand-painted],.app[data-focus=on] .book>[data-hand-painted]{display:none}
.app[data-focus=on] .cols{inset:0}
.app[data-focus=on] .unfocus{display:grid}
.app[data-focus=on] .doc{padding:64px 48px 110px}
.app[data-focus=on] .fbar{bottom:26px}

/* ---------- 设置（子页） ---------- */
.setp{position:absolute;inset:30px 40px 28px 64px;overflow:hidden}
.page:not([data-sub="1"]) .setp{display:none}
.setin{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.scard{position:relative;padding:16px 22px 18px}
.scard h2{margin:0 0 6px;font-family:var(--font-hand);font-size:17px;line-height:26px;font-weight:700}
.srowset{display:flex;align-items:center;gap:16px;min-height:52px;border-top:1px dashed var(--color-line)}
.scard h2+.srowset{border-top:0}
.sname{width:96px;flex:none;font-size:15px}
.sval{flex:1;display:flex;justify-content:flex-end}
.pm-seg{display:inline-flex}
.prev{margin-top:10px;padding:16px 20px 18px;border-radius:12px;background:var(--color-paper);border:1.5px dashed var(--color-line);font-family:var(--font-long);font-size:var(--fs);line-height:var(--lh)}
.prev h3{margin:0;font-family:var(--font-hand);font-size:1.4em;line-height:1.3}
.prev p{margin:.4em 0 0;max-width:var(--mw)}
.prevcap{display:flex;justify-content:space-between;font-size:12px;color:var(--color-ink-soft);margin-top:12px}

/* ---------- 右键的那条纸（照 Pomelo 的 md-menu：Design System 的 pm-menu） ---------- */
.ctx{position:absolute;z-index:60;width:212px;display:none;filter:drop-shadow(0 6px 14px var(--color-shadow));color:var(--color-ink)}
.ctx.show{display:flex}
.ctx.wide{width:388px}
.ctx .pm-menu-item{height:31px;padding:0 12px;font-size:14px;display:flex;align-items:center;justify-content:flex-start;gap:9px}
.ctx .pm-menu-item .ico{color:var(--color-pen)}
.ctx .keys{margin-left:auto;font-size:12px;color:var(--color-ink-soft);font-family:var(--font-hand)}
.ctx .pm-menu-item:hover{background:var(--color-selected)}
.ctx .grp{height:7px;padding:0}
.ctx .gridcell{display:block;height:auto;padding:10px}
.igrid{display:grid;grid-template-columns:repeat(9,1fr);gap:2px}
.icell{width:38px;height:36px;display:grid;place-items:center;border-radius:8px;color:var(--color-pen)}
.icell:hover{background:var(--color-selected)}
.ctx .back{font-weight:700;margin:0 !important}

/* ---------- 加密的笔记 ---------- */
.locked{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;max-width:none !important}
.locked .lt{font-family:var(--font-hand);font-size:22px;font-weight:700;line-height:30px}
.locked .ls{font-size:14px;color:var(--color-ink-soft);font-family:var(--font-hand)}
.locked .pm-btn{margin-top:8px}
.bigfp{color:var(--color-pen)}

/* ---------- 导出的设置（弹窗） ---------- */
.scrim{position:absolute;inset:0;z-index:70;background:rgba(20,24,18,.28);display:none}
.app[data-dlg=export] .scrim{display:block}
.dlg{position:absolute;left:360px;top:96px;width:560px;padding:22px 26px 20px 28px}
.dlg h2{margin:0;font-family:var(--font-hand);font-size:20px;line-height:28px;font-weight:700}
.dsub{font-size:13px;color:var(--color-ink-soft);margin-top:2px}
.drow{display:flex;align-items:flex-start;gap:14px;margin-top:16px}
.dlab{width:64px;flex:none;font-size:14px;line-height:36px;color:var(--color-ink-soft)}
.dval{flex:1;min-width:0}
.styles{display:flex;gap:14px}
.sty{position:relative;width:200px;padding:10px 10px 8px;text-align:left}
.sty .pk{position:absolute;inset:0;display:none}
.sty.on .pk{display:block}
.sty>*:not(.pk):not([data-hand-painted]){position:relative}
.stname{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:14px;font-weight:700}
.stname .ico{margin-left:auto;color:var(--color-pen)}
.sty:not(.on) .stname .ico{visibility:hidden}
.mini{display:flex;gap:6px;height:96px}
.mp{position:relative;width:68px;height:96px;border-radius:3px;box-shadow:0 1px 3px var(--color-shadow);overflow:hidden}
.checks{display:flex;flex-direction:column;gap:2px}
.checks .pm-check{min-height:34px;font-size:15px}
.dpath{display:flex;align-items:center;gap:8px}
.dpath .pm-field{flex:1;height:38px;font-size:14px;padding:0 12px;display:flex;align-items:center}
.dfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}

/* ---------- 减弱动态效果 ---------- */
.root[data-motion=reduce] *{transition:none !important;animation:none !important}
@media (prefers-reduced-motion: reduce){.root *{transition:none !important;animation:none !important}}

.root{width:1280px;height:800px}
.page{height:712px}

/* ---------- 见字如面：三栏直接排在纸上（站主 11-14），栏之间淡笔色的竖虚线 ---------- */
.cols{--gapx:0px;inset:18px 26px 20px 58px}
.vl{flex:none;width:0;margin:2px 9px 14px;border-left:1.5px dashed color-mix(in srgb,var(--color-pen) 30%,transparent)}
.app[data-fold="1"] .vl.v0{display:none}
.side{padding-top:2px}
.mtop{padding:0 6px 10px 2px}
.mtop .pm-field{height:36px}
.rb{width:36px;height:36px}
.list{inset:0 2px 6px 0}
.etop{height:36px;padding:0 4px 0 16px}
.eb.on{background:var(--color-selected)}
.doc{padding:8px 34px 96px}
.grow{flex:1}
/* 链接：画成能点的标题（模块的小贴纸 + 标题，链接色的淡底） */
.lk{display:inline-block;padding:0 6px 0 3px;margin:0 1px;border-radius:7px;color:var(--color-link);background:color-mix(in srgb,var(--color-link) 9%,transparent);font:inherit;line-height:inherit;white-space:nowrap;cursor:pointer;vertical-align:baseline}
.lk:hover{background:color-mix(in srgb,var(--color-link) 16%,transparent)}
.lk .mk{vertical-align:-.2em;margin-right:3px}
.lkd{color:var(--color-ink-soft);margin-left:6px;font-size:.85em}
/* 文章里嵌进来的一条念念不忘：小白卡，手札体，日期在上面，跟着那条笔记变 */
.emb{position:relative;padding:11px 16px 13px;font-family:var(--font-hand);margin-top:.9em !important}
.emb>*:not([data-hand-painted]){position:relative}
.eh{display:flex;align-items:center;gap:7px;font-size:13px;line-height:18px;color:var(--color-ink-soft)}
.eh .op{margin-left:auto;display:flex;color:var(--color-pen)}
.et{margin-top:5px;font-size:15px;line-height:1.75;color:var(--color-ink)}
.et .hash,.ncb .hash,.mnt .hash,.ctext .hash{font-size:1em}
.src{font-family:var(--font-hand);font-size:.82em;line-height:1.6;color:var(--color-ink-soft);margin-top:.9em !important}
.src+.emb{margin-top:.3em !important}
/* 浮在正文上的东西：挂在某一段后面一个零高的位置上 */
.ovr{position:relative;height:0}
.ovr>*{position:absolute !important;z-index:30}
.sug{left:22px;top:6px;width:348px;filter:drop-shadow(0 8px 16px var(--color-shadow));font-family:var(--font-hand);line-height:1.4;text-align:left}
.sug .pm-menu-item{height:48px;padding:0 12px;justify-content:flex-start;gap:10px;font-size:15px}
.sug .st{flex:1;min-width:0;display:flex;flex-direction:column}
.sug .stt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--color-ink)}
.sug .stm{font-size:12px;line-height:16px;color:var(--color-ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sug em,.tsug em{font-style:normal;background:linear-gradient(transparent 52%,var(--color-marker) 52%,var(--color-marker) 92%,transparent 92%)}
/* 书架：写的时候右边一栏念念不忘 */
.shelf{position:relative;flex:none;width:282px;display:flex;flex-direction:column;gap:10px;padding:14px 14px 0;margin:0 0 2px;font-family:var(--font-hand)}
.shelf>*:not([data-hand-painted]){position:relative}
.shh{display:flex;align-items:center;gap:8px;height:30px;flex:none}
.shh b{font-size:17px;line-height:24px}
.shh .x{margin-left:auto;width:28px;height:28px;display:grid;place-items:center;color:var(--color-pen);border-radius:8px}
.shelf .pm-field{height:36px;font-size:14px;flex:none}
.shelf .dd{width:100%;justify-content:space-between}
.shl{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;overflow:hidden;padding:2px 2px 10px}
.mn{position:relative;flex:none;padding:9px 12px 10px;font-size:14px;line-height:1.6;text-align:left;width:100%}
.mn>*:not([data-hand-painted]){position:relative}
.mnd{display:flex;align-items:center;gap:6px;font-size:12px;line-height:16px;color:var(--color-ink-soft)}
.mnd .gr{margin-left:auto;display:flex;color:var(--color-ink-soft)}
.mnt{margin-top:3px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mn.faded{opacity:.35}
.drag{left:150px;top:-26px;width:262px;transform:rotate(-2.5deg);filter:drop-shadow(0 14px 20px var(--color-shadow))}
.app[data-fold="1"] .fbar{display:none}
.doc .drop{height:0;margin-top:.55em !important;border-top:2.5px solid var(--color-primary);border-radius:2px}
/* 选一段 → 右键 */
.ctx.show{left:150px;top:-14px}
.ctx .pm-menu-item.lead{font-weight:700}
.ctx .pm-menu-item.lead .ico{color:var(--color-pen)}
/* 念念不忘的输入框从选中的那段下面弹出来 */
.clip{left:-8px;top:10px;width:440px;padding:16px 18px 12px;font-family:var(--font-hand);line-height:1.7;filter:drop-shadow(0 14px 24px var(--color-shadow))}
.clip>*:not([data-hand-painted]){position:relative}
.cslap{position:absolute !important;left:-20px;top:-24px;z-index:2}
.tsug{left:-4px;top:2px;width:200px;filter:drop-shadow(0 6px 12px var(--color-shadow))}
.tsug .pm-menu-item{height:34px;padding:0 12px;font-size:14px}
.tsug .n{font-size:12px;color:var(--color-ink-soft)}
/* 文章最后的「链接到这里的」 */
.bkx{margin-top:2.2em !important;padding-top:.8em;border-top:1.5px dashed var(--color-line);font-family:var(--font-hand)}
.bkh{font-size:13px;line-height:18px;color:var(--color-ink-soft);margin-bottom:8px}
.bkx .row{flex-wrap:wrap;gap:8px 8px}
.bkx .lk{font-size:14px;line-height:1.8;padding:1px 9px 1px 5px;border-radius:8px}

/* ---------- 页头（念念不忘、书影、玩物有志）：大标题，右边淡墨的数 ---------- */
.phd{position:absolute;left:66px;right:30px;top:22px;height:40px;display:flex;align-items:center;gap:14px}
.phd .pm-sheet-title{white-space:nowrap}
.pstat{margin:0;font-size:13px;color:var(--color-ink-soft);white-space:nowrap}
.pstat b{font-size:15px;color:var(--color-ink)}
.sbox{width:224px;height:36px;font-size:14px;flex:none}
.pm-field input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:14px;color:var(--color-ink)}
.pm-field input::placeholder{color:var(--color-ink-soft)}
.fic{display:flex;margin-right:2px}

/* ---------- 念念不忘 ---------- */
.nwrap{position:absolute;left:40px;right:26px;top:80px;bottom:14px;display:flex;gap:22px}
.nnav{width:232px;flex:none;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.nstat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:0 10px 12px}
.nstat b{display:block;font-size:20px;line-height:26px}
.nstat span{font-size:12px;color:var(--color-ink-soft)}
.heat{display:grid;grid-template-columns:repeat(16,11px);grid-template-rows:repeat(7,11px);grid-auto-flow:column;gap:2px;padding:0 10px 14px}
.heat i{border-radius:3px;display:block}
.h0{background:color-mix(in srgb,var(--color-ink) 7%,transparent)}
.h1{background:var(--color-cat-mint-bg)}
.h2{background:var(--color-cat-mint-sticker)}
.h3{background:var(--color-cat-mint)}
.h4{background:color-mix(in srgb,var(--color-cat-mint) 72%,var(--color-ink))}
.tslot{width:20px;flex:none;display:inline-flex;justify-content:center;color:var(--color-ink-soft)}
.nfeed{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;gap:12px;overflow:hidden;padding:2px 4px}
.comp{position:relative;flex:none;padding:12px 16px 10px;z-index:5}
.comp>*:not([data-hand-painted]){position:relative}
.ctext{min-height:50px;font-size:15px;line-height:1.75}
.ctext .ph{color:var(--color-ink-soft)}
.ctext .mkd{font-family:var(--font-hand)}
.cbar{display:flex;align-items:center;gap:8px;margin-top:4px}
.cbar .pm-btn{height:30px;padding:0 13px;font-size:14px}
.cbar .ibtn{width:30px;height:30px}
.nc{position:relative;flex:none;padding:10px 16px 12px}
.nc>*:not([data-hand-painted]){position:relative}
.nch{display:flex;align-items:center;gap:6px;height:22px;font-size:12px;color:var(--color-ink-soft)}
.nch .pin{color:var(--color-primary);display:flex}
.ncb{margin-top:3px;font-size:15px;line-height:1.75}
.ncbk{margin-top:8px}
.ncbk .tg{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--color-ink-soft);height:20px}
.brow{display:flex;align-items:center;gap:7px;height:28px;font-size:13px;color:var(--color-ink-soft);min-width:0;width:100%;text-align:left}
.brow .bt{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.brow .bd{flex:none;font-size:12px}
.ibtn{width:32px;height:32px;display:grid;place-items:center;border-radius:9px;color:var(--color-pen);flex:none}

/* ---------- 表格型（书影、玩物有志）：工具栏、白卡里的表、右边的面板 ---------- */
.tbar{position:absolute;left:62px;right:30px;top:76px;height:40px;display:flex;align-items:center;gap:10px}
.dd{height:36px;font-size:14px;gap:6px;padding:0 10px 0 12px;color:var(--color-ink);justify-content:space-between}
.dd .ico{color:var(--color-ink-soft)}
.ddl{display:flex;align-items:center;gap:6px;white-space:nowrap}
.tbar .pm-seg{height:36px}
.tbar .pm-seg-item{font-size:14px;min-width:0;padding:0 11px}
.tbar .pm-btn{height:34px;font-size:14px;padding:0 14px}
.ddw{position:relative}
.ddm{position:absolute;right:0;top:42px;width:176px;z-index:30;filter:drop-shadow(0 8px 16px var(--color-shadow))}
.ddm .pm-menu-item{height:34px;font-size:14px;padding:0 12px}
.ddm .act{color:var(--color-ink-soft);justify-content:flex-start}
.pm-menu-check{display:flex;color:var(--color-pen)}
.tcard{position:absolute;left:58px;right:28px;top:132px;bottom:16px;padding:4px 6px 0}
.tcard>*:not([data-hand-painted]){position:relative}
.gt{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:14px}
.gt th{height:32px;padding:0 10px;text-align:left;font-weight:400;font-size:12px;color:var(--color-ink-soft);border-bottom:1.5px dashed var(--color-line)}
.gt td{height:40px;padding:0 10px;border-top:1px dashed var(--color-line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gt tbody tr:first-child td{border-top:0}
.gt th:first-child,.gt td:first-child{padding-left:14px}
.gt tr.on td{background:var(--color-selected)}

.gt tr.on td:last-child{border-radius:0 9px 9px 0}
.gt .s{color:var(--color-ink-soft)}
.stars{display:inline-flex;gap:0;vertical-align:middle}
.spanel{position:absolute;top:4px;bottom:4px;right:4px;width:400px;z-index:12;display:flex;flex-direction:column;filter:drop-shadow(0 10px 22px var(--color-shadow))}
.spanel>*:not([data-hand-painted]){position:relative}
.sph{height:62px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 18px 10px 24px}
.sph h2{margin:0;font-size:20px;line-height:28px;font-weight:700}
.spb{flex:1;min-height:0;overflow:hidden;padding:6px 24px 8px;display:flex;flex-direction:column;gap:15px}
.fld{display:flex;flex-direction:column;gap:6px}
.fl{font-size:12px;line-height:16px;color:var(--color-ink-soft);display:flex;align-items:center;justify-content:space-between}
.fld .pm-field{height:38px;font-size:15px}
.fld .pm-field input{font-size:15px}
.fld .dd{width:100%;height:38px;font-size:15px}
.frow{display:flex;align-items:center;gap:6px}
.frow .pm-field{flex:1}
.spb .pm-seg{width:100%;height:36px}
.spb .pm-seg-item{flex:1;font-size:14px}
.ta{height:auto !important;min-height:64px;align-items:flex-start !important;padding:8px 12px !important;font-size:14px !important;line-height:1.6}
.runs{display:flex;flex-direction:column;gap:6px}
.run{display:flex;align-items:center;gap:8px}
.run .rn{width:50px;font-size:14px;flex:none}
.run .dd{width:100px;height:34px;font-size:14px}
.rx{color:var(--color-danger);width:26px;height:26px;display:grid;place-items:center;margin-left:auto}
.addrun{align-self:flex-start;display:flex;align-items:center;gap:3px;font-size:13px;color:var(--color-primary);height:24px}
.bkl{display:flex;flex-direction:column}
.bkr{display:flex;align-items:center;gap:8px;width:100%;height:36px;padding:0 6px;border-radius:9px;text-align:left;font-size:14px}
.bkr+.bkr{border-top:1px dashed var(--color-line)}
.bkr:hover{background:color-mix(in srgb,var(--color-selected) 60%,transparent)}
.bkt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bkd{flex:none;font-size:12px;color:var(--color-ink-soft)}
.spmeta{font-size:12px;color:var(--color-ink-soft)}
.spf{flex:none;display:flex;align-items:center;gap:8px;padding:12px 22px 14px 18px;border-top:1.5px dashed var(--color-line)}
.spf .pm-btn{height:32px;font-size:14px}
.spf .pm-btn--danger{padding:0 6px}
