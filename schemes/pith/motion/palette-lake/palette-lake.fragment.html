<!-- 从纸与海换到雾与赭（根元素换 data-palette）：五圈湖面波纹从右边的色板漾开。导出的动图用 .pith-smooth 的颜色过渡代替洇开（View Transitions 不能逐帧定格） -->
<div class="pith pith-smooth pl-demo" style="position:relative;width:520px;height:220px;overflow:hidden">
  <div style="padding:26px 28px">
    <p style="font:480 26px/1.2 var(--font-serif)">今天想弄清什么？</p>
    <p style="margin-top:8px;font:300 13px/1.4 var(--font-serif);color:var(--color-text-3)">问一个问题。/ 叫一个技能，@ 请一个角色，# 选知识库。</p>
    <div class="pith-composer" style="margin-top:22px;width:300px;height:44px"><span class="pith-composer-field"><span class="ph">问 Pith……</span></span><span class="pith-send" style="width:30px;height:30px">→</span></div>
  </div>
  <span class="pith-swatch" data-palette="mist-ochre" style="position:absolute;right:20px;top:90px"><i></i><b>雾与赭</b></span>

</div>
