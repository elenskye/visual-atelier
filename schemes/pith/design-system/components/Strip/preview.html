<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Strip</title>
<style>
  html, body { margin: 0; }
  .demo { display: flex; flex-direction: column; gap: 18px; padding: 24px 32px; width: 820px; }
  .pith-strip-item.is-sub, .pith-strip-fork .st, .pith-strip-fork .lf, .pith-strip-sub::before, .pith-strip-bud, .pith-strip-node::after { animation-duration: 0s !important; animation-delay: 0s !important; }
</style>
</head>
<body class="pith">
<div class="demo">
  <div class="pith-strip">
    <button class="pith-strip-item pith-ink">方法论<em>12</em></button>
    <button class="pith-strip-item pith-ink has-kids is-open">政治学<em>30</em></button>
    <span class="pith-strip-sub" style="--n:2">
      <svg class="pith-strip-fork" viewBox="0 0 24 36" aria-hidden="true"><path class="st" pathLength="1" d="M0 18C7.5 18 9 31.4 24 31.4"/><path class="lf" d="M9.4 25.2C8.2 20.6 10.6 17.6 15 16.6C15.8 20.8 13.8 24.2 9.4 25.2Z"/></svg>
      <button class="pith-strip-item pith-ink is-sub is-on" style="--i:0"><i class="pith-strip-node"></i>政治效能感<em>18</em></button>
      <button class="pith-strip-item pith-ink is-sub" style="--i:1"><i class="pith-strip-node"></i>比较政治<em>7</em></button>
      <i class="pith-strip-bud"></i>
    </span>
    <button class="pith-strip-item pith-ink has-kids">毕业论文<em>4</em></button>
    <button class="pith-strip-item pith-ink">读书会</button>
    <button class="pith-strip-item pith-ink is-add">＋ 集合</button>
  </div>
  <div class="pith-strip">
    <button class="pith-strip-item pith-ink is-on">全部</button>
    <button class="pith-strip-item pith-ink"><!-- @include marks/stages/seed.svg -->发芽<em>1</em></button>
    <button class="pith-strip-item pith-ink"><!-- @include marks/stages/sprout.svg -->生长<em>3</em></button>
    <button class="pith-strip-item pith-ink"><!-- @include marks/stages/evergreen.svg -->常青<em>2</em></button>
  </div>
</div>
</body>
</html>
