<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Buttons</title>
<style>

  .demo { padding: 24px 32px; }

  <div class="row"><span class="pith-button pith-sweep is-hover">加进文献库 <i class="ar" style="font-style:normal">→</i></span><span class="pith-button pith-button--quiet">先不加</span><a class="pith-link is-hover">知识库里这一段</a></div>
</div>
