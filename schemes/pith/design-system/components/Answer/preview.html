    <h2 class="pith-answer-title" style="font-size:26px">斯密为什么说分工受市场范围限制</h2>
    <p class="pith-p">斯密的推理只有一步：分工是因为能交换才出现的，所以分工能有多细，就看能交换多少，也就是<span class="pith-mark">市场有多大</span><b class="pith-ref is-on">1</b>。</p>
    <p class="pith-p is-quiet">市场太小，一个人就没法只干一件事：苏格兰高地的散村，农夫得给自家当屠夫、面包师和酿酒人<b class="pith-ref">2</b>。</p>
  </div>
