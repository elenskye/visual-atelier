<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Receipt</title>
<style>
  html, body { margin: 0; }
  .stage { padding: 24px 40px; }
  .pm-receipt { width: 300px; }
</style>
</head>
<body class="pm pm-desk">
<div class="stage">
  <div class="pm-receipt">
    <div class="pm-receipt-head">— 柚儿园 · 钱来钱往 · 11 月 3 日 —</div>
    <div class="pm-receipt-cut"></div>
    <div class="pm-receipt-row"><span>早饭 · 豆浆油条</span><span class="pm-num">¥12.00</span></div>
    <div class="pm-receipt-row"><span>午饭 · 番茄面</span><span class="pm-num">¥28.50</span></div>
    <div class="pm-receipt-row"><span>柚子茶</span><span class="pm-num">¥16.00</span></div>
    <div class="pm-receipt-row"><span>地铁</span><span class="pm-num">¥4.00</span></div>
    <div class="pm-receipt-cut"></div>
    <div class="pm-receipt-row pm-receipt-total"><span>合计</span><span class="pm-num">¥60.50</span></div>
    <div class="pm-receipt-cut"></div>
    <div class="pm-receipt-foot">谢谢光临 · 柚子</div>
  </div>
</div>
</body>
</html>
