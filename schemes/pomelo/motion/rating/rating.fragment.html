<!-- 评分：从一颗星点到五颗 -->

  <div class="pm-rating" role="radiogroup" aria-label="评分">
    <button type="button" class="pm-rating-star r0 is-on" role="radio" aria-checked="true" aria-label="1 颗星"><span data-hand="star" data-seed="1350"></span></button>
    <button type="button" class="pm-rating-star r1" role="radio" aria-checked="false" aria-label="2 颗星"><span data-hand="star" data-seed="1351"></span></button>
    <button type="button" class="pm-rating-star r2" role="radio" aria-checked="false" aria-label="3 颗星"><span data-hand="star" data-seed="1352"></span></button>
    <button type="button" class="pm-rating-star r3" role="radio" aria-checked="false" aria-label="4 颗星"><span data-hand="star" data-seed="1353"></span></button>
    <button type="button" class="pm-rating-star r4" role="radio" aria-checked="false" aria-label="5 颗星"><span data-hand="star" data-seed="1354"></span></button>
  </div>
</div>
