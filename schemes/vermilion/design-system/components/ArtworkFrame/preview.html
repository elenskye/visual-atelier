<!-- @dsCard group="图片" height=440 subtitle="作品位：同色图框、悬停出现的左右箭头（一个悬停态）" -->
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>ArtworkFrame</title>
<style>
  .vm-demo { padding: var(--space-6); max-width: 520px; }
  /* 网站上作品位高 min(74vh, 660px)；预览里固定 340px */
  .vm-demo .about-artwork { height: 340px; }
  /* 作品由使用方提供，这里用色块示意「完整等比显示」：竖图两侧露出页面色 */
  .vm-demo-art { display: block; width: 58%; height: 100%; margin: 0 auto; background: var(--color-surface-cool); }
  /* 箭头在网站上悬停作品位时才出现；这里常显，右箭头示意悬停态 */
  .vm-demo .artwork-arrow { opacity: 1; }
  .vm-demo .artwork-arrow.vm-hover { border-color: var(--color-ember); color: var(--color-ember); }
</style>
</head>
<body class="vm-page">
<div class="vm-demo">
  <figure class="about-artwork">
    <span class="vm-demo-art" role="img" aria-label="画作与摄影"></span>
    <button class="artwork-arrow artwork-arrow--prev" type="button" aria-label="上一张">
      <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <button class="artwork-arrow artwork-arrow--next vm-hover" type="button" aria-label="下一张">
      <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
    </button>
  </figure>
</div>
</body>
</html>
