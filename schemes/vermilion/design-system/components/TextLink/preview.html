<!-- @dsCard group="操作" height=260 subtitle="正文链接、安静链接；常态与悬停" -->
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>TextLink</title>
<style>
  .vm-demo { display: grid; gap: var(--space-5); padding: var(--space-5) var(--space-6); }
  .vm-demo-row { display: flex; flex-wrap: wrap; gap: var(--space-6); align-items: baseline; }
  .vm-demo-note { color: var(--color-muted); font-size: var(--text-xs); }
  /* 静态示意悬停态：与 bundle.css 里 :hover 的声明相同 */
  .text-link.vm-hover,
  .quiet-link.vm-hover { top: -1px; color: var(--color-ember); background-size: 50.5% 1.5px, 50.5% 1.5px; }
</style>
</head>
<body class="vm-page">
<div class="vm-demo">
  <div class="prose">
    <p>路线写在<a class="text-link" href="#">这篇游记</a>里；悬停时文字变朱红，下划线从两端收拢，链接<a class="text-link vm-hover" href="#">轻轻上浮</a>。</p>
  </div>
  <div class="vm-demo-row">
    <a class="quiet-link" href="#">查看全部写作</a>
    <a class="quiet-link vm-hover" href="#">查看全部写作</a>
    <span class="vm-demo-note">安静链接：常态 / 悬停</span>
  </div>
</div>
</body>
</html>
