<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<style>
  #__bundler_placeholder {
    margin: 0; min-height: 100vh; display: flex; align-items: center;
    justify-content: center; font: 13px/1.4 system-ui, sans-serif;
    color: #8a867f; background: #f5f3ee;
  }
</style>
</head>
<body>
<div id="__bundler_placeholder">Loading {{TITLE}}&hellip;<div id="__bundler_loading" style="margin-top:6px;opacity:.6">Unpacking&hellip;</div></div>
<script>
// Self-unpacking bundle — generated by Claude Design / visual-atelier.
// Decodes the embedded asset manifest (base64 + gzip via DecompressionStream),
// mints blob: URLs, substitutes UUID references in the template, then swaps the
// document root and re-runs scripts. Works from file:// and http(s):// with no
// server or flags required; external CDN scripts (React, Fonts, etc.) still fetch
// over the network if referenced by URL.
(async () => {
  const status = (msg) => {
    const el = document.getElementById('__bundler_loading');
    if (el) el.textContent = msg;
  };
  let errBox = null;
  const showErr = (msg) => {
    console.error('[bundle]', msg);
    if (!errBox) {
      errBox = document.createElement('pre');
      errBox.id = '__bundler_err';
      errBox.style.cssText =
        'position:fixed;bottom:12px;left:12px;right:12px;max-height:40vh;overflow:auto;' +
        'margin:0;padding:10px 12px;background:#2b1615;color:#ffdcd7;border:1px solid #8c3430;' +
        'border-radius:6px;font:11px/1.45 ui-monospace,monospace;z-index:2147483647;white-space:pre-wrap;';
    }
    if (!errBox.isConnected && document.body) document.body.appendChild(errBox);
    errBox.textContent += (errBox.textContent ? '\n\n' : '') + msg;
  };
  window.addEventListener('error', (e) => {
    // an <img> or <link> that failed (a {{hole}} before render, say) is not a script error
    if (!(e instanceof ErrorEvent)) return;
    const loc = e.filename ? ` (${e.filename}:${e.lineno || 0})` : '';
    showErr(`Uncaught ${e.error?.stack || e.message || e}${loc}`);
  }, true);
  window.addEventListener('unhandledrejection', (e) => {
    showErr(`Unhandled rejection: ${e.reason?.stack || e.reason}`);
  }, true);

  try {
    if (typeof DecompressionStream === 'undefined') {
      throw new Error('DecompressionStream not supported in this browser (need Chrome 80+, Firefox 113+, Safari 16.4+).');
    }

    // the JSON blocks come after this script: wait until the parser has reached them
    if (document.readyState === 'loading') await new Promise((r) => document.addEventListener('DOMContentLoaded', r, { once: true }));
    const readJson = (id) => JSON.parse(document.querySelector(`script[type="${id}"]`).textContent);
    const manifest = readJson('__bundler/manifest');
    const extResources = readJson('__bundler/ext_resources');
    const pageOrder = readJson('__bundler/page_order');
    let template = readJson('__bundler/template');

    const b64ToBytes = (b64) => {
      const bin = atob(b64);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    };
    const gunzip = async (bytes) => {
      const ds = new DecompressionStream('gzip');
      const w = ds.writable.getWriter();
      w.write(bytes);
      w.close();
      return new Response(ds.readable).arrayBuffer();
    };
    const bytesToB64 = (buf) => {
      const bytes = new Uint8Array(buf);
      let bin = '';
      const CHUNK = 0x8000;
      for (let i = 0; i < bytes.length; i += CHUNK) {
        bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
      }
      return btoa(bin);
    };
    const isFontMime = (m) => /^font\/|^application\/(x-)?font-|opentype|truetype|woff/i.test(m || '');

    const pageSet = new Set(pageOrder);
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = Object.create(null);
    const pageTexts = Object.create(null);
    const resourceBlobs = (window.__resourceBlobs = window.__resourceBlobs || Object.create(null));

    const uuids = Object.keys(manifest);
    status(`Unpacking ${uuids.length} assets…`);
    await Promise.all(uuids.map(async (u) => {
      const entry = manifest[u];
      const raw = b64ToBytes(entry.data);
      const bytes = entry.compressed ? await gunzip(raw) : raw.buffer;
      if (pageSet.has(u)) {
        pageTexts[u] = new TextDecoder().decode(bytes);
      } else if (isFontMime(entry.mime)) {
        const b64 = entry.compressed ? bytesToB64(bytes) : entry.data;
        blobUrls[u] = `data:${entry.mime};base64,${b64}`;
      } else {
        const blob = new Blob([bytes], { type: entry.mime });
        const url = URL.createObjectURL(blob);
        blobUrls[u] = url;
        resourceBlobs[url] = blob;
      }
    }));

    const OWN_ORIGIN = location.origin;
    const IS_OPAQUE = OWN_ORIGIN === 'null';
    const IS_FILE_ROOT = location.protocol === 'file:';
    const OWN_TARGET = (IS_OPAQUE || IS_FILE_ROOT) ? '*' : OWN_ORIGIN;
    const trustedOrigin = (e) => {
      if (IS_OPAQUE) return e.origin === 'null' || (e.origin === 'file://' && e.source === window.parent);
      if (IS_FILE_ROOT) return e.origin === 'null' || e.origin === 'file://';
      return e.origin === OWN_ORIGIN;
    };
    const ownFrameWindows = () => {
      const out = [];
      for (const f of document.querySelectorAll('iframe, frame')) {
        if (f.contentWindow) out.push(f.contentWindow);
      }
      return out;
    };
    const pendingRequests = new Map();
    const requestPage = (u) => {
      if (u in pageTexts) return Promise.resolve(pageTexts[u]);
      if (pendingRequests.has(u)) return pendingRequests.get(u);
      if (!window.parent || window.parent === window) return Promise.resolve(null);
      const p = new Promise((resolve) => {
        const t = setTimeout(() => { pendingRequests.delete(u); resolve(null); }, 10000);
        pendingRequests.set(u, { resolve: (txt) => { clearTimeout(t); resolve(txt); } });
      });
      pendingRequests.get(u).promise = p;
      window.parent.postMessage({ __bundler_need: u }, OWN_TARGET);
      return p;
    };
    window.addEventListener('message', (e) => {
      const d = e.data;
      if (!d || typeof d !== 'object') return;
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string') {
        const src = e.source;
        if (!src || ownFrameWindows().indexOf(src) < 0) return;
        const u = d.__bundler_need;
        requestPage(u).then((txt) => {
          if (txt != null) src.postMessage({ __bundler_page: u, __bundler_text: txt }, OWN_TARGET);
        });
      } else if (typeof d.__bundler_page === 'string' && typeof d.__bundler_text === 'string') {
        if (e.source !== window.parent) return;
        const u = d.__bundler_page;
        pageTexts[u] = d.__bundler_text;
        const pend = pendingRequests.get(u);
        if (pend) { pendingRequests.delete(u); pend.resolve(d.__bundler_text); }
      }
    });

    const mountPage = (el, frag, text) => {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const url = URL.createObjectURL(pageBlob) + (frag || '');
      el.setAttribute('src', url);
    };
    const MARKER_RE = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/i;
    const resolveFrameMarkers = (root) => {
      for (const f of root.querySelectorAll('iframe[src^="about:blank#"], frame[src^="about:blank#"]')) {
        const m = (f.getAttribute('src') || '').match(MARKER_RE);
        if (!m) continue;
        const [, u, frag] = m;
        if (isPageRoot && u in pageTexts) {
          mountPage(f, frag, pageTexts[u]);
        } else if (!isPageRoot) {
          requestPage(u).then((txt) => { if (txt != null) mountPage(f, frag, txt); });
        }
      }
    };

    for (const u of uuids) {
      if (u in blobUrls) template = template.split(u).join(blobUrls[u]);
    }
    template = template.replace(
      /<([a-zA-Z][\w-]*)(\s[^>]*?\b(?:src|href|data|poster)=["']blob:[^"']*["'][^>]*?)>/g,
      (full, tag, attrs) => `<${tag}${attrs
        .replace(/\s+integrity=(?:"[^"]*"|'[^']*'|[^\s>]+)/gi, '')
        .replace(/\s+crossorigin=(?:"[^"]*"|'[^']*'|[^\s>]+)/gi, '')
      }>`
    );

    const resourcesMap = Object.create(null);
    for (const r of extResources) {
      if (blobUrls[r.uuid]) resourcesMap[r.id] = blobUrls[r.uuid];
    }
    const resourcesJson = JSON.stringify(resourcesMap).replace(/</g, '\\u003c');
    const resourcesScript = `<script>window.__resources = Object.assign(window.__resources || {}, ${resourcesJson});<\/script>`;
    template = /<head[^>]*>/i.test(template)
      ? template.replace(/<head[^>]*>/i, (m) => m + resourcesScript)
      : resourcesScript + template;

    status('Rendering…');
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    resolveFrameMarkers(document);

    const isBabelType = (t) => /^text\/(babel|jsx)(\s*;|$)/i.test(t || '');
    const scripts = Array.from(document.scripts);
    for (const old of scripts) {
      const s = document.createElement('script');
      for (const attr of old.attributes) s.setAttribute(attr.name, attr.value);
      const src = old.getAttribute('src');
      if (src && isBabelType(old.type) && resourceBlobs[src]) {
        s.removeAttribute('src');
        s.textContent = await resourceBlobs[src].text();
      } else {
        s.textContent = old.textContent;
      }
      const wait = s.hasAttribute('src') && !s.async && !isBabelType(s.type) &&
        (!s.type || s.type === 'text/javascript' || s.type === 'module');
      const done = wait ? new Promise((r) => { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (done) await done;
    }
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      try { window.Babel.transformScriptTags(); } catch (e) { showErr(`Babel: ${e?.stack || e}`); }
    }
    if (errBox && document.body && !errBox.isConnected) document.body.appendChild(errBox);
  } catch (e) {
    showErr(e?.stack || String(e));
    status('Failed — see error below.');
  }
})();
</script>
<script type="__bundler/manifest">
{{MANIFEST_JSON}}
</script>
<script type="__bundler/ext_resources">
{{EXT_RESOURCES_JSON}}
</script>
<script type="__bundler/page_order">
{{PAGE_ORDER_JSON}}
</script>
<script type="__bundler/template">
{{TEMPLATE_JSON}}
</script>
</body></html>
